<div class="bg-white rounded-lg shadow-md p-6 border border-gray-200" role="form" aria-label="Formulario de agradecimiento">
  <div class="mb-4">
    <h3 class="text-xl font-semibold text-gray-900 mb-1">Dejar Agradecimiento</h3>
    <p class="text-sm text-gray-600">Expresa tu gratitud al donante por su generosidad</p>
  </div>

  <div class="space-y-4">
    <label for="acknowledgment-message" class="block text-sm font-medium text-gray-700 mb-2">
      Mensaje de agradecimiento
      <span class="text-red-500 ml-1" aria-label="requerido">*</span>
    </label>
    
    <textarea
      id="acknowledgment-message"
      [(ngModel)]="message"
      (input)="onMessageChange()"
      (keydown)="onKeyDown($event)"
      [maxlength]="maxLength"
      [placeholder]="placeholder"
      rows="4"
      [class]="'w-full px-4 py-3 border rounded-lg focus:ring-2 focus:ring-green-500 focus:border-green-500 resize-none transition-colors disabled:bg-gray-100 disabled:cursor-not-allowed focus:outline-none ' + (error ? 'border-red-500 focus:ring-red-500 focus:border-red-500' : 'border-gray-300')"
      [attr.aria-invalid]="error ? 'true' : 'false'"
      [attr.aria-describedby]="error ? 'error-message' : 'char-count'"
      aria-label="Campo de texto para escribir agradecimiento"
    ></textarea>

    <div class="flex items-center justify-between flex-wrap gap-2">
      <div class="text-sm text-gray-500" id="char-count" aria-live="polite">
        <span [class]="remainingChars < 10 ? 'text-red-600 font-bold' : remainingChars < 50 ? 'text-yellow-600 font-medium' : ''">
          {{ remainingChars }} caracteres restantes
        </span>
      </div>

      <div *ngIf="error" class="flex items-center gap-2 text-sm text-red-600 bg-red-50 px-3 py-2 rounded-md border border-red-200 w-full" id="error-message" role="alert" aria-live="assertive">
        <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
        </svg>
        {{ error }}
      </div>
    </div>

    <button
      type="button"
      (click)="onSubmit()"
      [disabled]="submitting || !message.trim() || !!error"
      class="w-full px-6 py-3 bg-green-600 text-white font-medium rounded-lg hover:bg-green-700 focus:outline-none focus:ring-2 focus:ring-green-500 focus:ring-offset-2 transition-colors disabled:opacity-50 disabled:cursor-not-allowed flex items-center justify-center gap-2"
      [attr.aria-busy]="submitting"
      aria-label="Enviar agradecimiento"
    >
      <span *ngIf="!submitting">Enviar Agradecimiento</span>
      <span *ngIf="submitting" class="flex items-center gap-2">
        <svg class="w-5 h-5 animate-spin" fill="none" viewBox="0 0 24 24" aria-hidden="true">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
        </svg>
        Enviando...
      </span>
    </button>

    <p class="text-xs text-gray-500 text-center mt-2" aria-label="Ayuda">
      <kbd class="px-2 py-1 bg-gray-100 border border-gray-300 rounded text-xs font-mono text-gray-700">Ctrl</kbd> + <kbd class="px-2 py-1 bg-gray-100 border border-gray-300 rounded text-xs font-mono text-gray-700">Enter</kbd> para enviar rápidamente
    </p>
  </div>
</div>
