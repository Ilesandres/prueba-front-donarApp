<div class="comment-form" role="form" aria-label="Formulario de comentario">
  <div class="form-container">
    <textarea
      [(ngModel)]="comment"
      (input)="onInput()"
      (keydown)="onKeyDown($event)"
      [maxlength]="maxLength"
      [placeholder]="placeholder"
      [disabled]="submitting"
      rows="3"
      class="comment-textarea"
      aria-label="Escribe tu comentario"
      aria-describedby="char-counter"
      aria-invalid="false"
    ></textarea>
    
    <div class="form-footer">
      <div class="char-counter" id="char-counter" [class.warning]="remainingChars < 50">
        {{ remainingChars }} caracteres restantes
      </div>
      
      <button
        type="button"
        (click)="onSubmit()"
        [disabled]="submitting || !comment.trim() || comment.length > maxLength"
        class="submit-button"
        aria-label="Publicar comentario"
      >
        <span *ngIf="!submitting">Publicar</span>
        <span *ngIf="submitting" class="loading">
          <svg class="spinner" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
          </svg>
          Publicando...
        </span>
      </button>
    </div>
    
    <div *ngIf="error" class="error-message" role="alert" aria-live="assertive">
      {{ error }}
    </div>
  </div>
</div>
