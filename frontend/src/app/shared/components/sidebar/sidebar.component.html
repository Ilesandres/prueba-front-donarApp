<aside *ngIf="isAuthenticated" class="w-80 bg-white border-r border-gray-200 h-screen sticky top-0 flex flex-col overflow-hidden">
  
  <!-- Header -->
  <div class="p-4 border-b border-gray-200 flex-shrink-0">
    <h2 class="text-xl font-bold text-gray-900 mb-3">DonacionApp</h2>
    
    <!-- Create Post Button -->
    <app-button 
      variant="primary" 
      size="md" 
      [fullWidth]="true"
      (btnClick)="onCreatePost()"
    >
      <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
      </svg>
      Nueva Publicación
    </app-button>
  </div>

  <!-- Quick Actions -->
  <div class="p-4 border-b border-gray-200 flex-shrink-0">
    <h3 class="text-sm font-semibold text-gray-500 uppercase mb-3">Accesos Rápidos</h3>
    <div class="space-y-1">
      <ng-container *ngFor="let action of quickActions">
        <button 
          (click)="onQuickActionClick(action)"
          class="w-full flex items-center justify-between px-3 py-2 rounded-lg hover:bg-gray-100 transition-colors text-left group cursor-pointer"
        >
        <div class="flex items-center gap-3">
          <svg [class]="'w-5 h-5 ' + action.color" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" [attr.d]="getIconPath(action.icon)"></path>
          </svg>
          <span class="text-sm font-medium text-gray-700 group-hover:text-gray-900">{{ action.label }}</span>
        </div>
        <span 
          *ngIf="action.count" 
          class="px-2 py-0.5 bg-green-500 text-white text-xs font-bold rounded-full"
        >
          {{ action.count }}
        </span>
      </button>
      </ng-container>
    </div>
  </div>

  <!-- Chats Section -->
  <div class="overflow-y-auto" style="max-height: calc(100vh - 470px); min-height: 200px;" (scroll)="onChatsScroll($event)">
    <div class="p-4">
      <div class="flex items-center justify-between mb-3 overflow-visible">
        <h3 class="text-sm font-semibold text-gray-500 uppercase">Mensajes</h3>
        <div class="flex items-center gap-2">
          <input [(ngModel)]="chatsSearch" (ngModelChange)="onSearchChange($event)" (keyup.enter)="onSearchChats()" placeholder="Buscar..." class="px-2 py-1 border rounded-md text-sm" />
          <!-- Options (three dots) -->
          <div class="relative">
            <button #optionsBtn data-sidebar-options-btn="true" (click)="toggleOptions()" class="p-1 hover:bg-gray-100 rounded">
              <svg class="w-4 h-4 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 12h.01M12 12h.01M18 12h.01"></path>
              </svg>
            </button>
            <!-- options menu is rendered to body via Renderer2 to avoid clipping -->
          </div>
        </div>
      </div>

      <!-- Chat List -->
      <div class="space-y-1">
        <div *ngIf="loadingChats" class="text-sm text-gray-600 mb-2">Cargando chats...</div>
        <div *ngIf="!loadingChats && chats.length === 0" class="text-sm text-gray-600 mb-2">No hay chats</div>

        <div
          *ngFor="let chat of chats"
          (click)="openChat(chat.id)"
          class="w-full flex items-start gap-3 p-3 rounded-lg hover:bg-gray-50 transition-colors text-left group relative"
          role="button"
          tabindex="0"
        >
          <!-- Avatar -->
          <div class="relative flex-shrink-0">
            <img
              [src]="chat.avatar"
              [alt]="chat.name"
              class="w-12 h-12 rounded-full object-cover"
            />
            <span *ngIf="chat.online" class="absolute bottom-0 right-0 w-3 h-3 bg-green-500 border-2 border-white rounded-full"></span>
            <!-- participants pill over avatar to save horizontal space -->
            <span *ngIf="chat.participants && chat.participants > 0" class="absolute -top-1 -right-1 bg-gray-100 text-xs text-gray-700 px-1 rounded-full border">{{ chat.participants }}</span>
          </div>

          <!-- Chat Info (reflowed to avoid overlap) -->
          <div class="flex-1 min-w-0">
            <div class="flex items-start justify-between mb-1">
              <div class="min-w-0 mr-3">
                <p class="text-sm font-semibold text-gray-900 truncate">{{ chat.name }}</p>
                <p class="text-xs text-gray-500 truncate">{{ chat.lastMessage }}</p>
              </div>
              <div class="flex flex-col items-end flex-shrink-0">
                <span class="text-xs text-gray-500">{{ formatRelative(chat.time) }}</span>
              </div>
            </div>

            <div class="flex items-center justify-between mt-1">
              <div class="text-xs text-gray-600 truncate mr-2">&nbsp;</div>
              <div class="flex items-center gap-2">
                <span *ngIf="chat.unread > 0" class="px-2 py-0.5 bg-green-500 text-white text-xs font-bold rounded-full">{{ chat.unread }}</span>
              </div>
            </div>
          </div>
          <!-- per-chat options button -->
          <button type="button" (click)="openChatMenu($event, chat.id)" class="absolute top-2 right-2 p-1 hover:bg-gray-100 rounded" aria-label="Opciones chat">
            <svg class="w-4 h-4 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 12h.01M12 12h.01M18 12h.01"></path>
            </svg>
          </button>
        </div>

        <div *ngIf="hasMoreChats && !loadingChats" class="text-center mt-2">
          <button (click)="loadMoreChats()" class="px-3 py-1 bg-gray-100 rounded-md text-sm">Cargar más</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <div class="p-4 border-t border-gray-200 bg-gray-50">
    <button 
      (click)="onProfileClick()"
      class="w-full flex items-center gap-3 hover:bg-gray-100 rounded-lg p-2 transition-colors group"
    >
      <img 
        src="https://i.pravatar.cc/150?img=33" 
        alt="Usuario"
        class="w-10 h-10 rounded-full object-cover"
      />
      <div class="flex-1 min-w-0 text-left">
        <p class="text-sm font-semibold text-gray-900 truncate group-hover:text-green-600">Mi Perfil</p>
        <p class="text-xs text-gray-500">Ver configuración</p>
      </div>
      <svg class="w-5 h-5 text-gray-600 group-hover:text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path>
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
      </svg>
    </button>
  </div>

</aside>
